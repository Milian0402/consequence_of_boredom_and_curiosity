 <title id="chart-title">Single-thread checked INT8 speed against the fastest qualifying FP32 method</title>
 <desc id="chart-description">At 3584 square, checked INT8 reached 2.98 times FP32 speed on Intel and 4.81 times on Arm. At 4096 square the ratios were 2.73 and 4.52. The strided rectangle reached 0.85 and 4.01, and binary handwriting images reached 1.28 and 4.23. One is parity.</desc>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Single-thread checked INT8 speed against the fastest qualifying FP32 method</dc:title>
    <dc:description>Warm paired ratios on exact integer inputs. Intel and Arm respectively: 3,584 square 2.98 and 4.81; 4,096 square 2.73 and 4.52; strided rectangle 0.85 and 4.01; binary handwriting images 1.28 and 4.23. One is parity.</dc:description>
    <dc:format>image/svg+xml</dc:format>
