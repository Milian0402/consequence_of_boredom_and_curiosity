name: One-thread FP32 world ranking
on:
  push:
    branches: [bench/native-linux-gemm]
permissions:
  contents: read
jobs:
  phase:
    runs-on: ubuntu-24.04
    outputs:
      label: ${{ steps.read.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: read
        run: echo "label=$(cat tools/world-rank/phase.txt)" >> "$GITHUB_OUTPUT"
  packing-cost:
    needs: phase
    if: needs.phase.outputs.label == 'packing-cost'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Measure cumulative packing and computation time
        run: python3 tools/world-rank/phase-cost/run.py "$PWD" "$RUNNER_TEMP/packing-cost"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: packing-cost-${{ github.run_id }}
          path: ${{ runner.temp }}/packing-cost
          retention-days: 14
  benchmark:
    needs: phase
    if: needs.phase.outputs.label != 'packing-cost'
    name: Frozen ranking on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x86_64}
          - {runner: ubuntu-24.04-arm, arch: aarch64}
    timeout-minutes: 70
    env:
      VENDOR_DIR: ${{ github.workspace }}/../world-rank-vendors
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare system tools and fallback FP64 BLAS
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y gcc gfortran make pkg-config libopenblas-pthread-dev unzip
          mkdir -p "$VENDOR_DIR" "$RUNNER_TEMP/rank-result"
      - name: Verify standalone fused kernels against FP64
        run: |
          if [[ $(uname -m) == aarch64 ]]; then
            flags=(-mcpu=native -DCOB_USE_NEON=1)
          else
            flags=(-march=native)
          fi
          cc -O3 -std=c11 -Iinclude "${flags[@]}" tests/test_fused_strassen.c -lm -o "$RUNNER_TEMP/test-fused"
          "$RUNNER_TEMP/test-fused" | tee "$RUNNER_TEMP/rank-result/fused-validation.txt"
      - name: Build pinned OpenBLAS
        id: openblas
        continue-on-error: true
        run: bash tools/world-rank/openblas/build.sh "$VENDOR_DIR"
      - name: Build AMD AOCL-BLAS
        id: aocl
        if: matrix.arch == 'x86_64'
        continue-on-error: true
        run: bash tools/world-rank/aocl/build.sh "$VENDOR_DIR"
      - name: Prepare native vendor BLAS
        id: vendor
        continue-on-error: true
        run: bash tools/world-rank/vendors/build.sh "$VENDOR_DIR"
      - name: Build LIBXSMM small-shape JIT kernels
        id: libxsmm
        continue-on-error: true
        run: bash tools/world-rank/libxsmm/build.sh "$VENDOR_DIR"
      - name: Build native BLASFEO and verify its standard SGEMM entry
        id: blasfeo
        if: success()
        continue-on-error: true
        run: |
          if [[ $(cat tools/world-rank/phase.txt) =~ ^(heldout|tile-screen|tile-confirm|tile-replay|tile-child)$ ]]; then
            bash tools/world-rank/blasfeo/build.sh "$VENDOR_DIR"
          fi
          if [[ $(cat tools/world-rank/phase.txt) == tile-replay && $(uname -m) == x86_64 ]]; then
            RANK_BLASFEO_ROW_SLAB=48 bash tools/world-rank/blasfeo/build.sh "$VENDOR_DIR"
          fi
      - name: Compare installed candidates against an independent FP64 product
        run: bash tools/world-rank/run.sh "$RUNNER_TEMP/rank-result" "$VENDOR_DIR"
      - name: Compare nine small workloads with warmed and cold JIT
        if: ${{ !cancelled() }}
        run: |
          if [[ $(cat tools/world-rank/phase.txt) == confirm ]]; then
            bash tools/world-rank/run-small.sh "$RUNNER_TEMP/rank-result/supplemental-small" "$VENDOR_DIR"
          fi
      - name: Record incomplete installation as a failed comparison
        if: >-
          ${{ !cancelled() && (steps.openblas.outcome == 'failure' ||
          steps.aocl.outcome == 'failure' || steps.vendor.outcome == 'failure' ||
          steps.libxsmm.outcome == 'failure' || steps.blasfeo.outcome == 'failure') }}
        run: |
          echo "At least one requested vendor build was unavailable." > "$RUNNER_TEMP/rank-result/missing-vendor.txt"
          exit 1
      - name: Preserve raw measurements and accuracy
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: world-rank-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rank-result
          if-no-files-found: warn
          retention-days: 14
