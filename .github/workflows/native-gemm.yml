name: One-thread FP32 world ranking
on:
  push:
    branches: [bench/native-linux-gemm]
permissions:
  contents: read
jobs:
  phase:
    runs-on: ubuntu-24.04
    outputs:
      label: ${{ steps.read.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: read
        run: echo "label=$(cat tools/world-rank/phase.txt)" >> "$GITHUB_OUTPUT"
  packing-cost:
    needs: phase
    if: needs.phase.outputs.label == 'packing-cost'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Measure cumulative packing and computation time
        run: python3 tools/world-rank/phase-cost/run.py "$PWD" "$RUNNER_TEMP/packing-cost"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: packing-cost-${{ github.run_id }}
          path: ${{ runner.temp }}/packing-cost
          retention-days: 14
  onednn:
    needs: phase
    if: needs.phase.outputs.label == 'aligned-core'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x86_64}
          - {runner: ubuntu-24.04-arm, arch: aarch64}
    runs-on: ${{ matrix.runner }}
    name: Build sequential oneDNN on ${{ matrix.arch }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build pinned oneDNN and qualify both wrappers
        env:
          JOBS: 4
        run: bash tools/world-rank/onednn/build.sh "$RUNNER_TEMP/onednn"
      - name: Package the verified libraries and build evidence
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/onednn-artifact"
          cd "$RUNNER_TEMP/onednn"
          if [[ -s qualified-oneshot.log && -s qualified-cached-plan.log ]] &&
             grep -q '^PASS ' qualified-oneshot.log && grep -q '^PASS ' qualified-cached-plan.log; then
            tar czf "$RUNNER_TEMP/onednn-artifact/runtime.tgz" prefix onednn-f32-{oneshot,cached-plan}.so
            cd "$RUNNER_TEMP/onednn-artifact"
            sha256sum runtime.tgz > runtime.tgz.sha256
            cd "$RUNNER_TEMP/onednn"
          fi
          for file in host.txt configure.log build.log install.log dependencies.txt build-fingerprint.txt imports.txt               cmake/CMakeCache.txt cmake/compile_commands.json qualified-{oneshot,cached-plan}.log; do
            if [[ -f $file ]]; then cp "$file" "$RUNNER_TEMP/onednn-artifact/"; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: onednn-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/onednn-artifact
          retention-days: 14
  benchmark:
    permissions:
      contents: read
      actions: read
    needs: [phase, onednn]
    if: ${{ !cancelled() && needs.phase.result == 'success' && needs.phase.outputs.label != 'packing-cost' && needs.phase.outputs.label != 'rank48-arm-confirm' && needs.phase.outputs.label != 'stream-release' && needs.phase.outputs.label != 'cropped-views' && needs.phase.outputs.label != 'arm-layout' }}
    name: ${{ needs.phase.outputs.label == 'grouped-b-x86' && format('Grouped B ranking on x86-64, replica {0}', matrix.replica) || needs.phase.outputs.label == 'frontier-x86' && format('Frontier ranking on x86-64, replica {0}', matrix.replica) || format('Frozen ranking on {0}', matrix.arch) }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((needs.phase.outputs.label == 'frontier-x86' || needs.phase.outputs.label == 'grouped-b-x86') && '[{"runner":"ubuntu-24.04","arch":"x86_64","replica":1},{"runner":"ubuntu-24.04","arch":"x86_64","replica":2}]' || needs.phase.outputs.label == 'stream-b' && '[{"runner":"ubuntu-24.04","arch":"x86_64"}]' || '[{"runner":"ubuntu-24.04","arch":"x86_64"},{"runner":"ubuntu-24.04-arm","arch":"aarch64"}]') }}
    timeout-minutes: 90
    env:
      FRONTIER_REPLICA: ${{ matrix.replica }}
      VENDOR_DIR: ${{ github.workspace }}/../world-rank-vendors
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.phase.outputs.label == 'frontier-x86' || needs.phase.outputs.label == 'grouped-b-x86'
        with:
          ref: a30d71f0aaba4bcceb9ec5c530cffd63e6967cd6
          path: production-source
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare system tools and fallback FP64 BLAS
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y gcc g++ gfortran make pkg-config libopenblas-pthread-dev unzip
          mkdir -p "$VENDOR_DIR" "$RUNNER_TEMP/rank-result"
      - name: Retrieve the same-family oneDNN build and evidence
        id: retrieve_onednn
        if: needs.phase.outputs.label == 'aligned-core'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: onednn-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/onednn-input
      - name: Fetch the pinned oneDNN artifact from the aligned-core run
        continue-on-error: true
        if: needs.phase.outputs.label == 'hk-forms' || needs.phase.outputs.label == 'release-replay' || needs.phase.outputs.label == 'medium-transfer' || needs.phase.outputs.label == 'stream-b' || needs.phase.outputs.label == 'frontier-x86' || needs.phase.outputs.label == 'grouped-b-x86' || needs.phase.outputs.label == 'signed-leaves'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$ARCH" in
            aarch64) id=15050168540; digest=320291dc07053789ccc0ef0c91a5dd2df6d5558021aac83ebb8df2aaccf7f227 ;;
            x86_64) id=15049984729; digest=df9673efd4ab4cf3b382e9392a0c17bdb324a018ef13aaba14df242ff8a0ae8d ;;
          esac
          dest="$RUNNER_TEMP/onednn-input"
          proof="$RUNNER_TEMP/rank-result/onednn/source"
          mkdir -p "$dest" "$proof"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > "$proof/github.json"
          jq -e --arg digest "sha256:$digest" --arg name "onednn-$ARCH-45672997916-1" \
            '.name==$name and .digest==$digest and .workflow_run.id==45672997916 and
             .workflow_run.head_sha=="29f5817ed45a728bc012f332fa378dc95c6e7ef5"' "$proof/github.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/onednn-hosted.zip"
          printf '%s  %s\n' "$digest" "$RUNNER_TEMP/onednn-hosted.zip" | sha256sum --check | tee "$proof/verified.txt"
          unzip -q "$RUNNER_TEMP/onednn-hosted.zip" -d "$dest"
      - name: Qualify oneDNN on the CPU that will be measured
        id: onednn
        if: needs.phase.outputs.label == 'aligned-core' || needs.phase.outputs.label == 'hk-forms' || needs.phase.outputs.label == 'release-replay' || needs.phase.outputs.label == 'medium-transfer' || needs.phase.outputs.label == 'stream-b' || needs.phase.outputs.label == 'frontier-x86' || needs.phase.outputs.label == 'grouped-b-x86' || needs.phase.outputs.label == 'signed-leaves'
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/onednn-input"
          sha256sum --check runtime.tgz.sha256
          mkdir -p "$VENDOR_DIR/onednn" "$RUNNER_TEMP/rank-result/onednn"
          tar xzf runtime.tgz -C "$VENDOR_DIR/onednn"
          bash "$GITHUB_WORKSPACE/tools/world-rank/onednn/qualify.sh" "$VENDOR_DIR/onednn" "$VENDOR_DIR/onednn/prefix/include"
          cp "$VENDOR_DIR/onednn"/{qualified-*.log,host.txt} "$RUNNER_TEMP/rank-result/onednn/"
          mkdir -p "$RUNNER_TEMP/rank-result/onednn/build"
          cp ./*.txt ./*.log ./runtime.tgz.sha256 "$RUNNER_TEMP/rank-result/onednn/build/"
          touch "$VENDOR_DIR/onednn/qualified"
      - name: Restore the pinned strict oneDNN peers when artifact reuse fails
        if: (needs.phase.outputs.label == 'frontier-x86' || needs.phase.outputs.label == 'grouped-b-x86') && steps.onednn.outcome != 'success'
        run: |
          bash tools/world-rank/onednn/build.sh "$VENDOR_DIR/onednn"
          mkdir -p "$RUNNER_TEMP/rank-result/onednn"
          cp "$VENDOR_DIR/onednn"/{qualified-*.log,host.txt,build-fingerprint.txt,imports.txt,dependencies.txt} "$RUNNER_TEMP/rank-result/onednn/"
          touch "$VENDOR_DIR/onednn/qualified"
      - name: Verify standalone fused kernels against FP64
        run: |
          if [[ $(uname -m) == aarch64 ]]; then
            flags=(-mcpu=native -DCOB_USE_NEON=1)
          else
            flags=(-march=native)
          fi
          cc -O3 -std=c11 -Iinclude "${flags[@]}" tests/test_fused_strassen.c -lm -o "$RUNNER_TEMP/test-fused"
          "$RUNNER_TEMP/test-fused" | tee "$RUNNER_TEMP/rank-result/fused-validation.txt"
      - name: Verify packed operand layout, fallbacks and whole-call bit identity
        id: forms_preflight
        continue-on-error: true
        if: needs.phase.outputs.label == 'hk-forms'
        run: |
          set -o pipefail
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          mkdir -p "$RUNNER_TEMP/rank-result/hk-forms"
          failed=0
          for level in tiny panel; do
            validation="$RUNNER_TEMP/rank-result/hk-forms/$level-validation"
            if taskset -c "$cpu" python3 tools/world-rank/hk-forms/run.py "$PWD" "$PWD" "$level" 2>&1 | tee "$validation.txt"; then
              touch "$validation.ok"
            else
              failed=1
            fi
          done
          exit "$failed"
      - name: Build pinned OpenBLAS
        id: openblas
        continue-on-error: true
        run: bash tools/world-rank/openblas/build.sh "$VENDOR_DIR"
      - name: Build AMD AOCL-BLAS
        id: aocl
        if: matrix.arch == 'x86_64'
        continue-on-error: true
        run: bash tools/world-rank/aocl/build.sh "$VENDOR_DIR"
      - name: Qualify the independent FastMMW Winograd comparator
        id: fastmmw
        if: needs.phase.outputs.label == 'tile-parent' || needs.phase.outputs.label == 'leaf-wave' || needs.phase.outputs.label == 'aligned-core' || needs.phase.outputs.label == 'hk-forms' || needs.phase.outputs.label == 'release-replay' || needs.phase.outputs.label == 'signed-leaves'
        continue-on-error: true
        run: |
          set -o pipefail
          bash tools/world-rank/fastmmw/native-ci.sh "$VENDOR_DIR" 2>&1 | tee "$RUNNER_TEMP/rank-result/fastmmw-qualification.txt"
      - name: Prepare native vendor BLAS
        id: vendor
        continue-on-error: true
        run: bash tools/world-rank/vendors/build.sh "$VENDOR_DIR"
      - name: Build LIBXSMM small-shape JIT kernels
        id: libxsmm
        env:
          RANK_FRONTIER_LIBXSMM: ${{ (needs.phase.outputs.label == 'frontier-x86' || needs.phase.outputs.label == 'grouped-b-x86') && '1' || '0' }}
        if: needs.phase.outputs.label != 'aligned-core' && needs.phase.outputs.label != 'hk-forms' && needs.phase.outputs.label != 'release-replay' && needs.phase.outputs.label != 'medium-transfer' && needs.phase.outputs.label != 'stream-b' && needs.phase.outputs.label != 'signed-leaves'
        continue-on-error: true
        run: bash tools/world-rank/libxsmm/build.sh "$VENDOR_DIR"
      - name: Build native BLASFEO and verify its standard SGEMM entry
        id: blasfeo
        if: success()
        continue-on-error: true
        run: |
          if [[ $(cat tools/world-rank/phase.txt) =~ ^(heldout|tile-screen|tile-confirm|tile-replay|tile-child|tile-parent|leaf-wave|aligned-core|hk-forms|release-replay|medium-transfer|signed-leaves|stream-b|frontier-x86|grouped-b-x86)$ ]]; then
            bash tools/world-rank/blasfeo/build.sh "$VENDOR_DIR"
          fi
          if [[ $(cat tools/world-rank/phase.txt) == tile-replay && $(uname -m) == x86_64 ]]; then
            RANK_BLASFEO_ROW_SLAB=48 bash tools/world-rank/blasfeo/build.sh "$VENDOR_DIR"
          fi
      - name: Qualify optional Intel Haswell TBLIS Strassen
        if: (needs.phase.outputs.label == 'aligned-core' || needs.phase.outputs.label == 'hk-forms' || needs.phase.outputs.label == 'release-replay') && matrix.arch == 'x86_64'
        continue-on-error: true
        run: bash tools/world-rank/tblis/build.sh "$VENDOR_DIR"
      - name: Restore missing pinned release peers
        id: restore_release
        if: needs.phase.outputs.label == 'release-replay'
        continue-on-error: true
        run: bash tools/world-rank/release-replay/restore-peers.sh "$VENDOR_DIR" "$RUNNER_TEMP/rank-result"
      - name: Compare installed candidates against an independent FP64 product
        run: bash tools/world-rank/run.sh "$RUNNER_TEMP/rank-result" "$VENDOR_DIR"
      - name: Compare optional vendor-assisted medium-wide public routes
        if: ${{ !cancelled() && needs.phase.outputs.label == 'stream-b' && env.RANK_STUDY_WORKER != '' }}
        run: bash tools/world-rank/vendor-wide/run.sh "$RUNNER_TEMP/rank-result/vendor-wide-secondary"
      - name: Compare certified rank-48 and rank-49 block schedules
        if: ${{ !cancelled() && needs.phase.outputs.label == 'signed-leaves' && env.RANK_STUDY_WORKER != '' }}
        run: bash tools/world-rank/rank48/run.sh "$RUNNER_TEMP/rank-result/finite-ranks"
      - name: Measure whole-call and component times on the same CPU
        if: ${{ !cancelled() && needs.phase.outputs.label == 'leaf-wave' }}
        run: |
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          bash tools/world-rank/hk-profile/run.sh "$PWD" "$RUNNER_TEMP/rank-result/hk-profile" "$cpu"
      - name: Compare nine small workloads with warmed and cold JIT
        if: ${{ !cancelled() }}
        run: |
          if [[ $(cat tools/world-rank/phase.txt) == confirm ]]; then
            bash tools/world-rank/run-small.sh "$RUNNER_TEMP/rank-result/supplemental-small" "$VENDOR_DIR"
          fi
      - name: Record incomplete installation as a failed comparison
        if: >-
          ${{ !cancelled() && ((needs.phase.outputs.label != 'release-replay' && needs.phase.outputs.label != 'signed-leaves' && needs.phase.outputs.label != 'frontier-x86' && needs.phase.outputs.label != 'grouped-b-x86' && (steps.openblas.outcome == 'failure' ||
          steps.aocl.outcome == 'failure' || steps.vendor.outcome == 'failure' ||
          steps.libxsmm.outcome == 'failure' || steps.blasfeo.outcome == 'failure' ||
          steps.fastmmw.outcome == 'failure' || steps.onednn.outcome == 'failure')) || steps.restore_release.outcome == 'failure') }}
        run: |
          echo "At least one requested vendor build was unavailable." > "$RUNNER_TEMP/rank-result/missing-vendor.txt"
          exit 1
      - name: Record a failed packed-forms correctness gate
        if: ${{ !cancelled() && steps.forms_preflight.outcome == 'failure' }}
        run: exit 1
      - name: Preserve raw measurements and accuracy
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ needs.phase.outputs.label == 'grouped-b-x86' && format('grouped-b-x86-{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.replica) || needs.phase.outputs.label == 'frontier-x86' && format('frontier-x86-{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.replica) || format('world-rank-{0}-{1}-{2}', matrix.arch, github.run_id, github.run_attempt) }}
          path: ${{ runner.temp }}/rank-result
          if-no-files-found: warn
          retention-days: 14

  rank48-arm-confirm:
    needs: phase
    if: needs.phase.outputs.label == 'rank48-arm-confirm'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      VENDOR_DIR: ${{ github.workspace }}/../rank48-confirm-vendors
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y gcc g++ make cmake pkg-config unzip
          mkdir -p "$VENDOR_DIR" "$RUNNER_TEMP/rank48-result"
      - name: Build serial OpenBLAS and ArmPL comparators
        run: |
          bash tools/world-rank/openblas/build.sh "$VENDOR_DIR"
          bash tools/world-rank/vendors/build.sh "$VENDOR_DIR"
      - name: Qualify both serial FastMMW cutoffs
        run: bash tools/world-rank/fastmmw/native-ci.sh "$VENDOR_DIR"
      - name: Build the exact public release and run the frozen Arm confirmation
        run: bash tools/world-rank/rank48-confirm/run.sh "$VENDOR_DIR" "$RUNNER_TEMP/rank48-result"
      - name: Preserve rank confirmation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: arm-rank48-confirm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rank48-result
          retention-days: 21

  production-x86:
    needs: phase
    if: needs.phase.outputs.label == 'stream-release'
    name: Accept public x86 stream-B release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve registered production source
        id: pin
        run: |
          revision=$(cat tools/world-rank/stream-release/release-revision.txt)
          [[ $revision =~ ^[a-f0-9]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.pin.outputs.revision }}
          path: production-source
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare serial numerical comparators
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y cmake gcc make pkg-config libopenblas-pthread-dev unzip
          bash tools/world-rank/vendors/build.sh "$RUNNER_TEMP/production-peers"
          cpus=$(python3 -c 'import os; print(",".join(map(str,sorted(os.sched_getaffinity(0))[:2])))')
          taskset -c "$cpus" bash tools/world-rank/aocl/build.sh "$RUNNER_TEMP/production-peers"
      - name: Check ordinary production builds and measure complete calls
        run: bash tools/world-rank/stream-release/run.sh "$PWD/production-source" "$RUNNER_TEMP/production-peers" "$RUNNER_TEMP/stream-release"
      - name: Preserve acceptance measurements and source identities
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stream-release-x86_${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stream-release
          retention-days: 30

  cropped-views:
    needs: phase
    if: needs.phase.outputs.label == 'cropped-views'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a30d71f0aaba4bcceb9ec5c530cffd63e6967cd6
          path: production-source
          persist-credentials: false
      - name: Rebuild the four independent release-acceptance peers
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y cmake gcc make pkg-config libopenblas-pthread-dev unzip
          bash tools/world-rank/vendors/build.sh "$RUNNER_TEMP/view-vendors"
          cpus=$(python3 -c 'import os; print(",".join(map(str,sorted(os.sched_getaffinity(0))[:2])))')
          taskset -c "$cpus" bash tools/world-rank/aocl/build.sh "$RUNNER_TEMP/view-vendors"
      - name: Measure ordinary cropped submatrices and aligned companions
        run: bash tools/world-rank/views/run.sh "$PWD/production-source" "$RUNNER_TEMP/view-vendors" "$RUNNER_TEMP/view-result"
      - name: Retain crop geometry, full verification, first calls and paired timings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: cropped-views-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/view-result
          if-no-files-found: error
          retention-days: 30

  layout-factors:
    needs: phase
    if: needs.phase.outputs.label == 'arm-layout'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a30d71f0aaba4bcceb9ec5c530cffd63e6967cd6
          path: production-source
          persist-credentials: false
      - name: Build the fixed sequential oneMKL peer
        run: bash tools/world-rank/vendors/build.sh "$RUNNER_TEMP/factor-vendors"
      - name: Measure six independent matrix layout factors
        run: bash tools/world-rank/factorial/run.sh "$PWD/production-source" "$RUNNER_TEMP/factor-vendors" "$RUNNER_TEMP/factor-result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: factorial-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/factor-result
          if-no-files-found: error
          retention-days: 30

  arm-wide:
    needs: phase
    if: needs.phase.outputs.label == 'arm-layout'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a30d71f0aaba4bcceb9ec5c530cffd63e6967cd6
          path: production-source
          persist-credentials: false
      - name: Build or verify independent Arm SGEMM libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y gcc g++ cmake make pkg-config unzip
          bash tools/world-rank/arm-wide/peers.sh "$RUNNER_TEMP/arm-vendors" "$RUNNER_TEMP/arm-result"
      - name: Run installed standalone variants and the independent field on one CPU
        run: bash tools/world-rank/arm-wide/run.sh "$PWD/production-source" "$RUNNER_TEMP/arm-vendors" "$RUNNER_TEMP/arm-result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: arm-wide-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arm-result
          if-no-files-found: error
          retention-days: 30
