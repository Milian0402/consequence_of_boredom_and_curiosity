name: One-thread FP32 world ranking
on:
  push:
    branches: [bench/native-linux-gemm]
permissions:
  contents: read
jobs:
  benchmark:
    name: Frozen ranking on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x86_64}
          - {runner: ubuntu-24.04-arm, arch: aarch64}
    timeout-minutes: 70
    env:
      VENDOR_DIR: ${{ github.workspace }}/../world-rank-vendors
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare system tools and fallback FP64 BLAS
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y gcc gfortran make pkg-config libopenblas-pthread-dev unzip
          mkdir -p "$VENDOR_DIR" "$RUNNER_TEMP/rank-result"
      - name: Build pinned OpenBLAS
        id: openblas
        continue-on-error: true
        run: bash tools/world-rank/openblas/build.sh "$VENDOR_DIR"
      - name: Build AMD AOCL-BLAS
        id: aocl
        if: matrix.arch == 'x86_64'
        continue-on-error: true
        run: bash tools/world-rank/aocl/build.sh "$VENDOR_DIR"
      - name: Prepare native vendor BLAS
        id: vendor
        continue-on-error: true
        run: bash tools/world-rank/vendors/build.sh "$VENDOR_DIR"
      - name: Compare installed candidates against an independent FP64 product
        run: bash tools/world-rank/run.sh "$RUNNER_TEMP/rank-result" "$VENDOR_DIR"
      - name: Record incomplete installation as a failed comparison
        if: >-
          ${{ !cancelled() && (steps.openblas.outcome == 'failure' ||
          steps.aocl.outcome == 'failure' || steps.vendor.outcome == 'failure') }}
        run: |
          echo "At least one requested vendor build was unavailable." > "$RUNNER_TEMP/rank-result/missing-vendor.txt"
          exit 1
      - name: Preserve raw measurements and accuracy
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: world-rank-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rank-result
          if-no-files-found: warn
          retention-days: 14
