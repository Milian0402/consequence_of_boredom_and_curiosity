name: Checked signed INT8 on one CPU thread
on:
  push:
    branches: [bench/certified-inputs]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    name: Checked signed INT8 on ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x86_64}
          - {runner: ubuntu-24.04-arm, arch: aarch64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    env:
      EXACT_CHECKED_S8: '1'
      VENDOR_DIR: ${{ github.workspace }}/../exact-vendors
      OUT_DIR: ${{ github.workspace }}/exact-output
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e4b7ce19cdf49f9175c86d3e91ea8d3a756eae9b
          path: production-source
          persist-credentials: false
      - name: Install single-thread FP64 oracle
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y gcc g++ gfortran make cmake pkg-config unzip libssl-dev
          mkdir -p "$VENDOR_DIR" "$OUT_DIR"
          bash tools/world-rank/openblas/build.sh "$VENDOR_DIR" > "$OUT_DIR/openblas-install.log" 2>&1 || { tail -50 "$OUT_DIR/openblas-install.log"; exit 1; }
      - name: Restore authenticated sequential FP32 and integer runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/world-rank/ragged-hk/restore-onednn.sh "$VENDOR_DIR" "$OUT_DIR" > "$OUT_DIR/onednn-restore.log" 2>&1
      - name: Build strongest previously measured FP32 peers
        run: |
          status=0
          bash tools/world-rank/release-replay/restore-peers.sh "$VENDOR_DIR" "$OUT_DIR" || status=$?
          printf '%s\n' "$status" > "$OUT_DIR/restoration-status.txt"
      - name: Run content proofs, controls and paired complete calls
        run: bash tools/world-rank/exact/run.sh "$PWD/production-source" "$VENDOR_DIR" "$OUT_DIR"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: checked-s8-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 30
